<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8' />
    <title>my First Map</title>
    <meta name='viewport' content='width=device-width, initial-scale=1' />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.6.0/mapbox-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
   </style>
</head>
<body>
   <div id='map'></div>
   <script>
      // Public access token that links map requests to my Mapbox account
      mapboxgl.accessToken = 'pk.eyJ1IjoiY2Fsc3RicyIsImEiOiJjbXV4MGF4NTQwMGRxMnlvZ2wwOWo1M3RhIn0.n6HrgH_9Pwq8AOwT_IU39A';
      // new mapboxgl.Map() creates the interactive map object and starts loading the style
      const mymap = new mapboxgl.Map({
             container: 'map',
             // style: 'mapbox://styles/mapbox/light-v11',
             // projection: 'globe', //Display the map as a globe since satellite-v9 defaults to Mercator
             center: [-122.29394, 47.62674], // Coordinates at the intersection of Washington Park and Madison Valley
             zoom:15 // This level of zoom focuses enough to see street and neighborhood names, but leaves enough space for the reader to orient themselves
          });
// code from the next step will go here!
mymap.addControl(new mapboxgl.FullscreenControl()); // Configures the fullscreen option in the top right corner
mymap.addControl(new mapboxgl.NavigationControl()); // Configures a navigation control under the fullscreen icon.
// Waits until Standard style has been loaded, then runs the function inside
mymap.on('style.load', () => {
       mymap.setConfigProperty('basemap', 'lightPreset', 'dusk');
       mymap.setConfigProperty('basemap', 'showPointOfInterestLabels', false);
       // Flattens the map. Useful when mapping dense areas or using choropleth data.
       mymap.setConfigProperty('basemap', 'show3dObjects', false); 
       // Removes transit icons, including bus, ferry, and light rail stops
       // Useful to remove extra clutter in thematic maps (parks, road closures) or in busy urban maps.
       mymap.setConfigProperty('basemap', 'showTransitLabels', false); 
      });
</script>
</body>
</html>
